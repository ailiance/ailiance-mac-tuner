# Devstral Small 2 (24B MLX 4bit) — python domain
# ailiance project: coding adapter

model_id: models/Devstral-Small-2-24B-Instruct-2512
dataset_id: python

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: all-linear

precision: bf16
num_epochs: 1
