# Apertus 70B — electronics domain
# eu-kiki project: hardware reasoning adapter

model_id: models/Apertus-70B-Instruct-2509
dataset_id: electronics

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: all-linear

precision: bf16
num_epochs: 1
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00001
weight_decay: 0.01
warmup_ratio: 0.05
lr_scheduler: cosine
max_seq_length: 1024
memory_limit_gb: 480
val_batches: 5

save_every: 100
save_total_limit: 3
early_stopping_patience: 3

output_dir: output/eu-kiki/apertus-electronics
