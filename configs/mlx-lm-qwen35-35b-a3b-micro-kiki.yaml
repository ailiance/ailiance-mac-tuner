# Qwen3.5-35B-A3B — micro-kiki stack-01 chat-fr (v5)
# Curriculum seq: start short, extend progressively
# Coexists with Brainstacks running in parallel
model: models/Qwen3.5-35B-A3B-Opus-bf16
data: data/micro-kiki/chat-fr
train: true
fine_tune_type: lora
optimizer: adamw
num_layers: -1
lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.01
batch_size: 1
iters: 500
val_batches: 5
learning_rate: 1e-5
steps_per_report: 10
steps_per_eval: 100
save_every: 100
grad_accumulation_steps: 16
max_seq_length: 512
grad_checkpoint: true
clear_cache_threshold: 4
adapter_path: output/micro-kiki/stack-01-chat-fr
seed: 42
