# micro-kiki stack-01 chat-fr — Phase 1: foundations (seq=512)
model: models/Qwen3.5-35B-A3B-Opus-bf16
data: data/micro-kiki/chat-fr
train: true
fine_tune_type: lora
optimizer: adamw
num_layers: -1
lora_parameters:
  rank: 64
  scale: 64.0
  dropout: 0.01
batch_size: 1
iters: 500
val_batches: 5
learning_rate: 8e-6
steps_per_report: 10
steps_per_eval: 100
save_every: 100
grad_accumulation_steps: 16
max_seq_length: 512
grad_checkpoint: true
clear_cache_threshold: 4
adapter_path: output/micro-kiki/stack-01-chat-fr
seed: 42
